<script type="text/javascript">
    RED.nodes.registerType('barcode-reader',{
        category: 'RP Utils',
        color: '#a6bbcf',
        inputs: 1,
        outputs: 1,
        icon: 'font-awesome/fa-barcode',
        label: function() {
            return this.name || "barcode-reader";
        },
        labelStyle: { color: '#000000' },
        defaults: {
            name:              { value: "barcode-reader" },
            inputValue:        { value: "payload", required: true},
            outputValue:       { value: "payload", required: true},
            executionMode:     { value: "parallel" },
            blocks:            { value: [
                { decoder: "zbar", preprocessing: "original", options: {} }
            ]}
        },
        oneditprepare: function() {
            const node = this;

            // Initialize typedInput for input and output fields
            $('#node-input-inputValue').typedInput({
                type: 'msg',
                types: ['msg']
            });
            $('#node-input-outputValue').typedInput({
                type: 'msg',
                types: ['msg']
            });

            // Per-decoder supported formats (canonical names)
            const FORMATS_BY_DECODER = {
                zbar: [
                    'UPCA', 'UPCE', 'EAN13', 'EAN8',
                    'Code128', 'Code39', 'Code93', 'Codabar',
                    'ITF', 'QRCode', 'PDF417', 'DataBar'
                ],
                zxing: [
                    'UPCA', 'UPCE', 'EAN13', 'EAN8',
                    'Code128', 'Code39', 'Code93', 'Codabar',
                    'ITF', 'QRCode', 'PDF417',
                    'DataMatrix', 'Aztec', 'DataBar'
                ],
                quagga2: [
                    'UPCA', 'UPCE', 'EAN13', 'EAN8',
                    'Code128', 'Code39', 'Code93', 'Codabar', 'ITF'
                ],
                'rp-projection': [
                    'UPCA', 'UPCE', 'EAN13', 'EAN8',
                    'Code128', 'Code39', 'Code93', 'Codabar',
                    'ITF', 'DataBar'
                ],
                rosepetal: [
                    'UPCA', 'UPCE', 'EAN13', 'EAN8',
                    'Code128', 'Code39', 'Code93', 'Codabar', 'ITF'
                ]
            };

            // Initialize blocks
            const blocksContainer = $('#blocks-container');
            const blocks = node.blocks || [];

            // Render existing blocks
            blocks.forEach((block, index) => {
                addBlockUI(block, index);
            });

            // Add block button handler
            $('#add-block-btn').on('click', function() {
                const newBlock = {
                    decoder: 'zbar',
                    preprocessing: 'original',
                    options: {}
                };
                addBlockUI(newBlock, blocks.length);
            });

            // Make blocks sortable
            blocksContainer.sortable({
                handle: '.drag-handle',
                axis: 'y',
                cursor: 'move',
                update: function() {
                    updateBlockNumbers();
                }
            });

            // Render the formats grid for a given decoder, preserving any
            // currently-checked formats that are still supported by the new decoder.
            function renderFormatsGrid(blockElement, decoder, preselected) {
                const supported = FORMATS_BY_DECODER[decoder] || [];
                const checkboxes = supported.map(f => `
                    <label class="format-checkbox">
                        <input type="checkbox" class="format-cb" value="${f}"
                            ${preselected.has(f) ? 'checked' : ''}>
                        <span>${f}</span>
                    </label>
                `).join('');
                blockElement.find('.formats-grid').html(checkboxes);
            }

            // Projection has no preprocessing step but has its own options; the Rosepetal SDK keeps
            // preprocessing and adds its own option rows
            function toggleDecoderRows(blockElement, decoder) {
                const isProjection = decoder === 'rp-projection';
                const isRosepetal = decoder === 'rosepetal';
                blockElement.find('.preprocessing-row').toggle(!isProjection);
                blockElement.find('.projection-row').toggle(isProjection);
                blockElement.find('.rosepetal-row').toggle(isRosepetal);
            }

            // Saved option or its default (an absent, null or empty value is unset, as in lib/rp-mapping.js), and
            // the attribute fragments the rosepetal rows are rendered with
            function rpOption(block, key, fallback) {
                const value = block.options ? block.options[key] : undefined;
                return value === undefined || value === null || value === '' ? fallback : value;
            }
            function rpSelected(block, key, fallback, value) {
                return rpOption(block, key, fallback) === value ? 'selected' : '';
            }
            function rpChecked(block, key, fallback) {
                return rpOption(block, key, fallback) ? 'checked' : '';
            }

            function addBlockUI(block, index) {
                const blockId = `block-${Date.now()}-${index}`;
                const initialSelected = new Set(block.options?.formats || []);
                const formatsAll = initialSelected.size === 0;

                const blockHTML = `
                    <li class="block-item" data-block-id="${blockId}">
                        <div class="block-header">
                            <div class="block-header-left">
                                <i class="fa fa-bars drag-handle"></i>
                                <span class="block-number">Block ${index + 1}</span>
                            </div>
                            <button type="button" class="remove-block-btn">
                                <i class="fa fa-trash"></i>
                            </button>
                        </div>
                        <div class="block-config">
                            <div class="block-form-row">
                                <label>Decoder</label>
                                <select class="block-decoder">
                                    <option value="zbar" ${block.decoder === 'zbar' ? 'selected' : ''}>ZBar</option>
                                    <option value="zxing" ${block.decoder === 'zxing' ? 'selected' : ''}>ZXing</option>
                                    <option value="quagga2" ${block.decoder === 'quagga2' ? 'selected' : ''}>Quagga2</option>
                                    <option value="rp-projection" ${block.decoder === 'rp-projection' ? 'selected' : ''}>Rosepetal Projection (noisy 1D)</option>
                                    <option value="rosepetal" ${block.decoder === 'rosepetal' ? 'selected' : ''}>Rosepetal SDK</option>
                                </select>
                            </div>

                            <div class="block-form-row preprocessing-row">
                                <label>Preprocessing</label>
                                <select class="block-preprocessing">
                                    <option value="original" ${block.preprocessing === 'original' ? 'selected' : ''}>Original</option>
                                    <option value="histogram" ${block.preprocessing === 'histogram' ? 'selected' : ''}>Histogram Equalization</option>
                                    <option value="otsu" ${block.preprocessing === 'otsu' ? 'selected' : ''}>Otsu Threshold</option>
                                </select>
                            </div>

                            <div class="block-form-row projection-row">
                                <label>Min votes</label>
                                <input type="number" class="block-min-votes" min="1" step="1" value="${block.options?.minVotes || 3}">
                            </div>

                            <div class="block-form-row rosepetal-row">
                                <label>Effort</label>
                                <select class="block-rp-effort">
                                    <option value="robust" ${rpSelected(block, 'effort', 'robust', 'robust')}>Robust (default)</option>
                                    <option value="normal" ${rpSelected(block, 'effort', 'robust', 'normal')}>Normal (fast lane)</option>
                                </select>
                            </div>
                            <div class="block-form-row rosepetal-row">
                                <label>Directions</label>
                                <select class="block-rp-directions">
                                    <option value="both" ${rpSelected(block, 'directions', 'both', 'both')}>Rows and columns</option>
                                    <option value="horizontal" ${rpSelected(block, 'directions', 'both', 'horizontal')}>Rows only</option>
                                    <option value="vertical" ${rpSelected(block, 'directions', 'both', 'vertical')}>Columns only</option>
                                </select>
                                <span class="rp-hint">Effort Normal only: Robust always scans both</span>
                            </div>
                            <div class="block-form-row rosepetal-row">
                                <label>Add-ons</label>
                                <select class="block-rp-addon">
                                    <option value="ignore" ${rpSelected(block, 'addOn', 'ignore', 'ignore')}>Ignore EAN-2 / EAN-5</option>
                                    <option value="read" ${rpSelected(block, 'addOn', 'ignore', 'read')}>Read as separate symbols</option>
                                    <option value="require" ${rpSelected(block, 'addOn', 'ignore', 'require')}>Require (drop EAN/UPC without add-on)</option>
                                </select>
                            </div>
                            <div class="block-form-row rosepetal-row">
                                <label>Quiet zone</label>
                                <select class="block-rp-quietzone">
                                    <option value="tolerant" ${rpSelected(block, 'quietZone', 'tolerant', 'tolerant')}>Tolerant (default)</option>
                                    <option value="spec" ${rpSelected(block, 'quietZone', 'tolerant', 'spec')}>Spec (GS1 / 10X)</option>
                                </select>
                            </div>
                            <div class="block-form-row rosepetal-row">
                                <label>Min lines</label>
                                <input type="number" class="block-rp-minlines" min="0" step="1" value="${rpOption(block, 'minLines', 0)}">
                            </div>
                            <div class="block-form-row rosepetal-row">
                                <label>Timeout (ms)</label>
                                <input type="number" class="block-rp-timeout" min="1" max="2147483647" step="100" value="${rpOption(block, 'timeoutMs', 5000)}">
                            </div>
                            <div class="block-form-row rosepetal-row">
                                <label>Flags</label>
                                <div class="rosepetal-flags">
                                    <label class="format-checkbox"><input type="checkbox" class="block-rp-tryinvert" ${rpChecked(block, 'tryInvert', true)}><span>Try inverted image</span></label>
                                    <label class="format-checkbox"><input type="checkbox" class="block-rp-upca" ${rpChecked(block, 'upcaAsEan13', false)}><span>UPC-A as EAN-13</span></label>
                                    <label class="format-checkbox"><input type="checkbox" class="block-rp-code39" ${rpChecked(block, 'code39FullAscii', false)}><span>Code 39 full ASCII</span></label>
                                    <label class="format-checkbox"><input type="checkbox" class="block-rp-checksum" ${rpChecked(block, 'checksum', false)}><span>Optional checksum</span></label>
                                    <span class="rp-hint rp-hint-wide">Try inverted image: Effort Normal only (Robust always tries it)</span>
                                </div>
                            </div>

                            <div class="block-form-row formats-row">
                                <label>Formats</label>
                                <div class="formats-controls">
                                    <div class="formats-toolbar">
                                        <label class="format-checkbox all-formats-wrapper">
                                            <input type="checkbox" class="all-formats-cb" ${formatsAll ? 'checked' : ''}>
                                            <span>All formats</span>
                                        </label>
                                        <span class="formats-hint">List shows only formats supported by the selected decoder</span>
                                    </div>
                                    <div class="formats-grid" style="display: ${formatsAll ? 'none' : 'grid'};"></div>
                                </div>
                            </div>
                        </div>
                    </li>
                `;

                blocksContainer.append(blockHTML);
                const blockElement = $(`[data-block-id="${blockId}"]`);
                if (block.options?.stripWidth) {
                    blockElement.data('stripWidth', block.options.stripWidth);
                }

                // Initial formats grid for this block's decoder
                renderFormatsGrid(blockElement, block.decoder || 'zbar', initialSelected);
                toggleDecoderRows(blockElement, block.decoder || 'zbar');

                // Decoder change handler — re-render formats grid keeping still-supported selections
                blockElement.find('.block-decoder').on('change', function() {
                    const decoder = $(this).val();
                    const currentlyChecked = new Set();
                    blockElement.find('.format-cb:checked').each(function() {
                        currentlyChecked.add($(this).val());
                    });
                    renderFormatsGrid(blockElement, decoder, currentlyChecked);
                    toggleDecoderRows(blockElement, decoder);
                });

                // "All formats" toggles the grid; checking it unchecks individual formats
                blockElement.find('.all-formats-cb').on('change', function() {
                    const checked = $(this).is(':checked');
                    blockElement.find('.formats-grid').toggle(!checked);
                    if (checked) {
                        blockElement.find('.format-cb').prop('checked', false);
                    }
                });

                // Picking any individual format implies "All formats" is off
                blockElement.on('change', '.format-cb', function() {
                    if ($(this).is(':checked')) {
                        blockElement.find('.all-formats-cb').prop('checked', false);
                        blockElement.find('.formats-grid').show();
                    }
                });

                // Remove button handler
                blockElement.find('.remove-block-btn').on('click', function() {
                    blockElement.remove();
                    updateBlockNumbers();
                });

                updateBlockNumbers();
            }

            function updateBlockNumbers() {
                blocksContainer.find('.block-item').each(function(index) {
                    $(this).find('.block-number').text(`Block ${index + 1}`);
                });
            }
        },
        oneditsave: function() {
            const blocks = [];

            $('#blocks-container .block-item').each(function() {
                const blockElement = $(this);
                const decoder = blockElement.find('.block-decoder').val();
                const preprocessing = blockElement.find('.block-preprocessing').val();

                const options = {};

                // Formats: empty array = "all formats" (handled by C++/JS defaults)
                const allFormats = blockElement.find('.all-formats-cb').is(':checked');
                if (!allFormats) {
                    const selected = [];
                    blockElement.find('.format-cb:checked').each(function() {
                        selected.push($(this).val());
                    });
                    options.formats = selected;
                } else {
                    options.formats = [];
                }

                if (decoder === 'rp-projection') {
                    options.minVotes = parseInt(blockElement.find('.block-min-votes').val(), 10) || 3;
                    // stripWidth is auto; a value set in the flow JSON is still honoured
                    if (blockElement.data('stripWidth')) {
                        options.stripWidth = blockElement.data('stripWidth');
                    }
                }

                if (decoder === 'rosepetal') {
                    // Enums as chosen; integers as whole numbers (an empty or invalid input saves the default, as Min
                    // votes does; a typed `1e3` is 1000, where parseInt would stop at the exponent and save 1 ms);
                    // booleans from the checkboxes. optionsFromBlock (lib/rp-mapping.js) is strict: never a string
                    // number, a NaN, a negative Min lines or a Timeout outside [1, 2147483647] (the largest delay a
                    // Node timer takes; above it every decode would time out at once) in the flow
                    const int = (v) => { const n = v === '' ? NaN : Math.trunc(Number(v)); return Number.isFinite(n) ? n : NaN; };
                    const minLines = int(blockElement.find('.block-rp-minlines').val());
                    const timeoutMs = int(blockElement.find('.block-rp-timeout').val());
                    options.effort = blockElement.find('.block-rp-effort').val();
                    options.directions = blockElement.find('.block-rp-directions').val();
                    options.addOn = blockElement.find('.block-rp-addon').val();
                    options.quietZone = blockElement.find('.block-rp-quietzone').val();
                    options.minLines = minLines >= 0 ? minLines : 0;
                    options.timeoutMs = timeoutMs >= 1 && timeoutMs <= 2147483647 ? timeoutMs : 5000;
                    options.tryInvert = blockElement.find('.block-rp-tryinvert').is(':checked');
                    options.upcaAsEan13 = blockElement.find('.block-rp-upca').is(':checked');
                    options.code39FullAscii = blockElement.find('.block-rp-code39').is(':checked');
                    options.checksum = blockElement.find('.block-rp-checksum').is(':checked');
                }

                blocks.push({
                    decoder: decoder,
                    preprocessing: preprocessing,
                    options: options
                });
            });

            this.blocks = blocks;
        },
        oneditcancel: function() {
            // Cleanup if needed
        }
    });
</script>


<script type="text/html" data-template-name="barcode-reader">
    <div class="form-row">
        <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
        <input type="text" id="node-input-name" placeholder="Name">
    </div>

    <div class="form-row">
        <label for="node-input-inputValue"><i class="fa fa-sign-in"></i> Input</label>
        <input type="text" id="node-input-inputValue" placeholder="msg.payload">
    </div>

    <div class="form-row">
        <label for="node-input-outputValue"><i class="fa fa-sign-out"></i> Output</label>
        <input type="text" id="node-input-outputValue" placeholder="msg.payload">
    </div>

    <div class="form-row">
        <label for="node-input-executionMode"><i class="fa fa-cogs"></i> Execution Mode</label>
        <select id="node-input-executionMode" style="width: 240px;">
            <option value="parallel">Parallel (all blocks, merge results)</option>
            <option value="sequential">Sequential (stop at first success)</option>
        </select>
    </div>

    <div class="form-row">
        <label><i class="fa fa-cubes"></i> Decoder Blocks</label>
        <div style="margin-left: 105px;">
            <ol id="blocks-container"></ol>
            <button type="button" id="add-block-btn" class="add-block-button">
                <i class="fa fa-plus"></i> Add Block
            </button>
        </div>
    </div>

    <div class="form-row">
        <div class="info-box">
            <strong>ℹ️ How it works:</strong><br>
            • Each block = decoder + preprocessing method + optional format filter<br>
            • <strong>Parallel</strong>: All blocks run, results merged and deduplicated<br>
            • <strong>Sequential</strong>: Blocks run in order (drag to reorder), stops at first success<br>
            • Delete blocks you don't need<br><br>
            <strong>💡 Tips:</strong><br>
            • Maximum detection: Parallel with multiple preprocessing options<br>
            • Best speed: Sequential with fastest preprocessing first<br>
            • Reduce false positives: pick only the formats you actually expect (e.g. just UPCA for retail labels)
        </div>
    </div>
</script>

<script type="text/html" data-help-name="barcode-reader">
    <p>A multi-decoder barcode and QR code scanner supporting ZBar, ZXing, Quagga2, Rosepetal Projection and the Rosepetal SDK engine, with flexible block-based configuration.</p>

    <h3>Overview</h3>
    <p>This node provides a flexible, block-based architecture for barcode detection. Each block combines a decoder (ZBar, ZXing, Quagga2, Rosepetal Projection or the Rosepetal SDK) with preprocessing options, allowing you to optimize for either maximum detection rate or performance.</p>

    <h3>Configuration</h3>
    <dl class="message-properties">
        <dt>Name <span class="property-type">string</span></dt>
        <dd>Optional name for the node instance</dd>

        <dt>Input/Output <span class="property-type">msg property</span></dt>
        <dd>Message properties for input image and output results (default: <code>msg.payload</code>)</dd>

        <dt>Execution Mode</dt>
        <dd>
            <strong>Parallel</strong>: Runs all blocks simultaneously and merges results<br>
            <strong>Sequential</strong>: Processes blocks in order, stops at first detection
        </dd>
    </dl>

    <h3>Decoder Blocks</h3>
    <p>Each block represents a detection attempt with specific configuration:</p>

    <h4>Decoder Options</h4>
    <ul>
        <li><strong>ZBar</strong>: Fast, reliable, good for standard barcodes and QR codes</li>
        <li><strong>ZXing</strong>: Comprehensive format support, thorough scan by default</li>
        <li><strong>Quagga2</strong>: JavaScript-based, good for 1D barcodes</li>
        <li><strong>Rosepetal Projection</strong>: for noisy or low-resolution 1D codes that the others miss. Expects a crop of a single barcode. Aligns the bars, averages bands of pixels into clean 1D profiles, decodes each profile with ZBar and ZXing and accepts a value only when enough profiles agree. Slower (tens to a few hundred ms), so use it as a fallback block. 1D only; no preprocessing step (gray and each color channel are tried internally).</li>
        <li><strong>Rosepetal SDK</strong>: Rosepetal's own 1D engine (EAN/UPC with add-ons, Code 128 / GS1-128, Code 39, Code 93, Codabar, ITF), run as a local <code>rp-barcode serve</code> process shared by every barcode-reader node. Robust by default (dense scans, rows and columns, inverted image); returns the real bar extent, the reading orientation and the number of agreeing scan lines. 1D only: blocks whose Formats hold only 2D codes return nothing without calling the engine. See <em>Rosepetal SDK</em> below for installation and what changes against the other decoders.</li>
    </ul>

    <h4>Per-block Options</h4>
    <ul>
        <li><strong>Formats</strong>: allowlist of barcode symbologies. "All formats" leaves the decoder unrestricted (default). The list shown is filtered to formats the selected decoder actually supports — ZBar covers most 1D + QR/PDF417, ZXing adds DataMatrix and Aztec, Quagga2, Rosepetal Projection and the Rosepetal SDK are 1D-only.</li>
        <li><strong>Min votes</strong> (Rosepetal Projection): profile reads that must agree before a value is reported (default 3). Raise it to cut false reads, lower it for very small crops. Decoding stops early once a value has 3× this many votes and leads every other value by 3×; the vote count at that point is the result's quality.</li>
        <li><strong>Band height</strong> (Rosepetal Projection) is automatic: 12% of the bar height, clamped to 8-48 px, with a second pass at twice that. Advanced: <code>options.stripWidth</code> (px) in the flow JSON overrides it, e.g. smaller on strongly curved surfaces.</li>
        <li><strong>Effort</strong> (Rosepetal SDK): <code>robust</code> (default, parity with the always-on Try Harder of ZXing blocks) or <code>normal</code> for the fast lane.</li>
        <li><strong>Directions</strong>, <strong>Add-ons</strong>, <strong>Quiet zone</strong>, <strong>Min lines</strong>, <strong>Timeout</strong> (Rosepetal SDK): scan rows and/or columns (only with Effort <code>normal</code>: <code>robust</code> always scans both); ignore, read (as separate <code>EAN-2</code>/<code>EAN-5</code> symbols) or require EAN/UPC add-ons; tolerant or spec quiet zones; scan lines that must agree (0 = per-symbology default); per-request timeout in ms (default 5000; a timed-out block warns and returns nothing).</li>
        <li><strong>Flags</strong> (Rosepetal SDK): <em>Try inverted image</em> (default on; only with Effort <code>normal</code>: <code>robust</code> always tries the inverted image); <em>UPC-A as EAN-13</em> (13 digits with a leading 0, the 1.1.3 behaviour: turn it on for templates saved with 1.1.3); <em>Code 39 full ASCII</em> (expand the <code>$ % + /</code> shift pairs as ZXing blocks do: turn it on for templates saved from a ZXing block); <em>Optional checksum</em> (require and verify the Code 39 / ITF / Codabar check character).</li>
    </ul>

    <h4>Preprocessing Options</h4>
    <ul>
        <li><strong>Original</strong>: Grayscale conversion only (fastest)</li>
        <li><strong>Histogram Equalization</strong>: Enhances contrast, good for poor lighting</li>
        <li><strong>Otsu Threshold</strong>: Binary image, best for low-contrast barcodes</li>
    </ul>

    <h3>Input Format</h3>
    <p>Accepts images in multiple formats:</p>
    <ul>
        <li>Rosepetal bitmap format with colorSpace field</li>
        <li>Raw bitmap with width, height, data, channels</li>
        <li>JPEG/PNG buffers</li>
        <li><strong>Arrays of images</strong>: Process multiple images, returns nested results</li>
    </ul>

    <h3>Output Format</h3>
    <p>For single image input, returns array of detected barcodes:</p>
    <pre>[{
  format: "EAN-13",
  value: "4006381333931",
  box: {
    center: { x: 0.5, y: 0.5 },      // Relative coordinates (0-1)
    size: { width: 0.82, height: 0.88 },
    angle: 0
  },
  corners: [                          // Relative coordinates
    { x: 0.11, y: 0.06 },
    { x: 0.93, y: 0.06 },
    { x: 0.93, y: 0.94 },
    { x: 0.11, y: 0.94 }
  ],
  detectedBy: ["zbar_original", "rosepetal_original"],   // "&lt;decoder&gt;_&lt;preprocessing&gt;" of every block that read this value
  // Only when the Rosepetal SDK block is the first block that read the value:
  symbology: "EAN13", identifier: "]E0", orientation: 0, lines: 40, confidence: 1, checksum: "valid"
}]</pre>

    <p>For array input, returns nested array: <code>[[img1_results], [img2_results]]</code></p>

    <h3>Rosepetal SDK</h3>
    <p><strong>Installation.</strong> The engine is the <code>rp-barcode</code> binary of <code>rosepetal-barcode-sdk</code> (0.2.x). The node finds it, in this order, in <code>RP_BARCODE_ENGINE</code> (path to the binary), in the platform package <code>@rosepetal/barcode-engine-linux-x64</code> / <code>@rosepetal/barcode-engine-linux-arm64</code> (Rosepetal private npm registry; optional dependencies of the <code>@rosepetal/barcode-engine-client</code> package this node depends on, so <code>npm install</code> needs access to that registry) or as <code>rp-barcode</code> in <code>PATH</code>. Without it the block warns once per node and outage (<em>Rosepetal engine not available</em>, with this guidance) and returns nothing; every other block keeps working. The engine is one process per Node-RED, started by the first decode, stopped when the last node with a Rosepetal SDK block closes, and restarted with a growing wait (1 s to 30 s) if it dies. The engine version is logged once per node at its first use (<code>Rosepetal engine 0.2.0 (protocol 1, pid N)</code>); whatever the engine writes to its stderr appears in the Node-RED log as <code>[rp-barcode] …</code> warnings.</p>
    <p><strong>What changes against the ZBar / ZXing blocks</strong> (same <code>msg</code> contract, fields are only added):</p>
    <ul>
        <li><code>corners</code> are the real bar extent in reading order TL, TR, BR, BL, so <code>box.angle</code> is <code>0</code> for a horizontal code (ZXing gives ±90 there) and ±90 for a vertical one; <code>orientation</code> (0/90/180/270, clockwise reading direction) tells 0 from 180.</li>
        <li><code>detectedBy</code> is an array of <code>"&lt;decoder&gt;_&lt;preprocessing&gt;"</code> strings, one per block that read the value, as always, so a Rosepetal-only flow gives length 1: use <code>lines</code> (agreeing scan lines) and <code>confidence</code> (0-1) as confidence instead of the number of blocks.</li>
        <li>UPC-A comes out as 12 digits (<code>UPC-A</code>); <em>UPC-A as EAN-13</em> gives the 13-digit form of 1.1.3.</li>
        <li>Code 39 shift pairs are transmitted as printed unless <em>Code 39 full ASCII</em> is on (ZXing blocks always expand them).</li>
        <li>GS1-128 values carry the FNC1 separators as the character <code>\u001d</code> (GS) and no leading FNC1; ZXing blocks print the human-readable <code>(01)…(10)…</code> form instead, so templates saved from a ZXing block need re-saving or a match without the parentheses.</li>
        <li>Format names use the ZXing spelling (<code>EAN-13</code>, <code>UPC-A</code>, <code>Code128</code>, <code>Code39</code>, <code>Code93</code>, <code>Codabar</code>, <code>ITF</code>) plus <code>EAN-2</code> / <code>EAN-5</code> for add-ons read as separate symbols.</li>
        <li>When several blocks read the same value, the geometry and the extra fields (<code>symbology</code>, <code>identifier</code>, <code>orientation</code>, <code>lines</code>, <code>confidence</code>, <code>checksum</code>) come from the lowest block: put the Rosepetal SDK block first to get <code>orientation</code>, <code>lines</code> and the exact corners in the output.</li>
        <li>A legacy <code>tryHarder</code> in the flow JSON is ignored by a Rosepetal SDK block (Effort <code>robust</code> covers it); a value outside the vocabulary (e.g. <code>effort: "fast"</code>) fails that block with a warning and returns nothing, the other blocks run.</li>
    </ul>

    <h3>Usage Strategies</h3>

    <h4>Maximum Detection (Parallel Mode)</h4>
    <ol>
        <li>Add multiple blocks with different decoders</li>
        <li>Use various preprocessing options per block</li>
        <li>Set execution mode to Parallel</li>
        <li>Trade performance for comprehensive detection</li>
    </ol>

    <h4>Optimized Performance (Sequential Mode)</h4>
    <ol>
        <li>Order blocks from fastest to slowest</li>
        <li>Start with Original preprocessing</li>
        <li>Add fallback blocks with stronger preprocessing</li>
        <li>Set execution mode to Sequential</li>
    </ol>

    <h3>Examples</h3>

    <p><strong>Example 1: Maximum detection</strong></p>
    <ul>
        <li>Block 1: ZBar + Original</li>
        <li>Block 2: ZBar + Histogram</li>
        <li>Block 3: ZXing + Original</li>
        <li>Mode: Parallel</li>
    </ul>

    <p><strong>Example 2: Fast with fallback</strong></p>
    <ul>
        <li>Block 1: ZBar + Original (fastest)</li>
        <li>Block 2: ZXing + Histogram (if first fails)</li>
        <li>Block 3: ZXing + Otsu (last resort)</li>
        <li>Mode: Sequential</li>
    </ul>

    <p><strong>Example 3: Production line, single known format</strong></p>
    <ul>
        <li>Block 1: ZBar + Original, Formats: <code>UPCA</code> only</li>
        <li>Mode: Parallel (single block)</li>
        <li>Result: avoids false positives from labels/text and forces 12-digit UPC-A output (no EAN-13 leading-zero ambiguity).</li>
    </ul>

    <h3>Troubleshooting</h3>
    <dl class="message-properties">
        <dt>No detection</dt>
        <dd>Add blocks with stronger preprocessing (Histogram, Otsu) or add a ZXing block alongside ZBar. If Formats is restricted, double-check the actual symbology of your barcode.</dd>

        <dt>UPC-A read as EAN-13 with leading 0</dt>
        <dd>Add <code>UPCA</code> to the Formats list (or enable both <code>UPCA</code> and <code>EAN13</code>). When neither is restricted, ZBar may emit UPC-A codes as EAN-13 with a leading 0.</dd>

        <dt>Slow performance</dt>
        <dd>Use Sequential mode or reduce the number of blocks. Restricting Formats also gives a small speedup, especially on ZXing blocks.</dd>

        <dt>Duplicate results</dt>
        <dd>This is normal in Parallel mode - duplicates are automatically deduplicated and tracked in "detectedBy"</dd>

        <dt>Rosepetal engine not available</dt>
        <dd>Install the platform package (<code>@rosepetal/barcode-engine-linux-x64</code> or <code>-linux-arm64</code>, 0.2.x) next to this node or set <code>RP_BARCODE_ENGINE</code> to an executable <code>rp-barcode</code> of SDK 0.2 or later; a protocol mismatch means the binary is too old or too new for this node version. The warning is printed once per node and outage (again only after the engine worked and went away); the block returns nothing until the engine is found.</dd>

        <dt>Rosepetal SDK block times out or reports "engine exited"</dt>
        <dd>Raise <strong>Timeout</strong> for very large images, or switch <strong>Effort</strong> to <code>normal</code>. After a crash the block returns nothing while the engine restarts (1 s, then up to 30 s between attempts); the next message is read by the new process. The engine's own messages appear as <code>[rp-barcode] …</code> warnings in the Node-RED log.</dd>
    </dl>
